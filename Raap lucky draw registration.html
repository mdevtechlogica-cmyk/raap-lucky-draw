<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raap lucky draw registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fd;--bg2:#e4ebfa;--card:rgba(255,255,255,.86);--ink:#171e5c;--mute:#5a6499;--line:rgba(47,56,146,.16);--acc:#1b75bc;--acc-ink:#fff;--blue:#2f3892;--ok:#0b8f63;
--hd:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--bd:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f3f6fd}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fd;--bg2:#e4ebfa;--card:rgba(255,255,255,.86);--ink:#171e5c;--mute:#5a6499;--line:rgba(47,56,146,.16);--acc:#1b75bc;--acc-ink:#fff;--blue:#2f3892;--ok:#0b8f63;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--bd);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.2;pointer-events:none;z-index:0}
.o1{width:300px;height:300px;background:var(--blue);top:-80px;right:-90px;animation:drift 14s ease-in-out infinite alternate}
.o2{width:260px;height:260px;background:var(--acc);bottom:80px;left:-110px;opacity:.22;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,60px) scale(1.15)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:22px 20px 110px}
h1,h2,h3{font-family:var(--hd);margin:0;letter-spacing:-.02em;line-height:1.05}
h1{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:800}
h2{font-size:1.9rem;font-weight:800}
p{margin:0}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 72%);pointer-events:none;z-index:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:34px}
.bl{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.wm{font:800 1.25rem var(--hd);letter-spacing:-.02em;line-height:1}
.wm small{display:block;font:600 .68rem var(--bd);letter-spacing:.04em;color:var(--mute);margin-top:4px}
.site{color:var(--ink);text-decoration:none;font-weight:700;font-size:.8rem;border:1px solid var(--line);padding:8px 13px;border-radius:999px;background:var(--card);transition:border-color .2s}
.site:hover,.site:focus-visible{border-color:var(--acc);outline:none}
.lnk{color:var(--acc);font-weight:700;text-decoration:none}
.logo{display:block;height:84px;width:auto}
.lead{color:var(--mute);margin:14px 0 26px;max-width:34ch}
.hero-ticket{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1px dashed var(--acc);color:var(--acc);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.85rem;margin-bottom:18px;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(27,117,188,.22)}}
form{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(47,56,146,.14);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 18px;display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input,textarea{resize:vertical;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;min-height:54px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(27,117,188,.28)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{font-weight:600;font-size:.9rem;margin-bottom:8px;padding:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;min-height:0;cursor:pointer}
.chip span{display:block;text-align:center;padding:15px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;transition:transform .15s,background .2s,border-color .2s}
.chip.wide{grid-column:1/-1}
.chip input:checked+span{background:linear-gradient(90deg,var(--blue),var(--acc));color:var(--acc-ink);border-color:var(--acc);transform:scale(1.03)}
.chip input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.btn{font:700 1.05rem var(--hd);background:linear-gradient(90deg,var(--blue),var(--acc));color:var(--acc-ink);border:0;border-radius:16px;min-height:58px;padding:0 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.4s infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost::after{display:none}
.err{color:#c62f4a;font-size:.85rem;min-height:1.2em}
.fine{color:var(--mute);font-size:.8rem;text-align:center;margin-top:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:999px;box-shadow:0 10px 30px rgba(47,56,146,.18)}
nav a{color:var(--mute);text-decoration:none;font-weight:700;font-size:.88rem;padding:11px 18px;border-radius:999px;transition:background .2s,color .2s}
nav a.on{background:linear-gradient(90deg,var(--blue),var(--acc));color:var(--acc-ink)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 20px;margin-top:18px;position:relative;overflow:hidden}
.prod::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-60px;top:-60px;background:var(--c);opacity:.28;filter:blur(8px)}
.prod h3{font-size:1.7rem;margin-bottom:6px}
.prod p{color:var(--mute)}
.prod ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.prod li{display:flex;gap:10px;align-items:flex-start}
.prod li::before{content:"";flex:none;width:9px;height:9px;margin-top:8px;border-radius:50%;background:var(--c)}
.more{margin:34px 0 4px}
.pgrid{display:grid;gap:10px;margin-top:14px}
.pc{display:grid;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--ink);text-decoration:none;transition:transform .2s,border-color .2s}
.pc b{font:700 1.1rem var(--hd)}
.pc span{color:var(--mute);font-size:.9rem}
a.pc:hover,a.pc:focus-visible{transform:translateY(-3px);border-color:var(--acc);outline:none}
.chip input:checked+span::before{content:"✓ "}
.btn.busy{pointer-events:none;opacity:.9}
.btn.busy::before{content:"";display:inline-block;width:16px;height:16px;margin-right:10px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-3px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okov{position:fixed;inset:0;z-index:24;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px;padding:24px;background:rgba(243,246,253,.97);animation:fin .35s both}
.okov.out{animation:fout .45s both}
.okov p{color:var(--mute)}
.okov h2{animation:rise .6s .7s both}
.okov p{animation:rise .6s .9s both}
.okc{position:relative;width:110px;height:110px;margin-bottom:14px}
.okc svg{position:relative;filter:drop-shadow(0 12px 26px rgba(47,56,146,.4))}
.okcirc{fill:var(--blue);transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.okchk{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .45s ease-out forwards}
.okr{position:absolute;inset:0;border-radius:50%;border:3px solid var(--acc);opacity:0;animation:ring 1.5s .5s ease-out infinite}
.okr.r2{animation-delay:1s}
@keyframes pop{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes fin{from{opacity:0}}
@keyframes fout{to{opacity:0}}
.ticket-wrap{perspective:900px;margin-top:8px}
.tk{filter:drop-shadow(0 24px 40px rgba(47,56,146,.35))}
.tk-top,.tk-bot{background:linear-gradient(150deg,#1b75bc,#2f3892 80%);color:#fff;padding:26px 22px;position:relative}
.tk-top{border-radius:26px 26px 0 0;transform-origin:50% 100%;animation:tearTop 1.1s cubic-bezier(.2,.9,.3,1.2) both}
.tk-bot{border-radius:0 0 26px 26px;background:linear-gradient(150deg,#2f3892,#232b78);animation:tearBot 1.1s cubic-bezier(.2,.9,.3,1.2) both}
.tk-top::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;border-bottom:3px dashed rgba(255,255,255,.55)}
.tk-top::before,.tk-bot::before{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--bg);left:-14px;z-index:2}
.tk-top::before{bottom:-14px}.tk-bot::before{top:-14px}
.notch-r{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--bg);right:-14px;z-index:2}
.tk-top .notch-r{bottom:-14px}.tk-bot .notch-r{top:-14px}
@keyframes tearTop{0%{transform:translateY(60px) rotateX(70deg);opacity:0}60%{transform:translateY(-6px) rotateX(-6deg);opacity:1}100%{transform:none}}
@keyframes tearBot{0%{transform:translateY(-70px);opacity:0}55%{opacity:1}75%{transform:translateY(12px)}100%{transform:none}}
.tk small{opacity:.8;font-weight:600}
.tk .big{font:800 2rem var(--hd);letter-spacing:.04em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.tk .name{font:700 1.5rem var(--hd);margin-top:14px}
.tk .row{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.tk .row div{display:grid}
.bars{height:44px;margin-top:14px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 9px,transparent 9px 11px,#fff 11px 12px,transparent 12px 16px);opacity:.85;border-radius:4px}
.cheer{text-align:center;margin:6px 0 22px;animation:rise .7s .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;animation:rise .7s 1.1s both}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin-top:14px}
.del{background:none;border:0;color:#c62f4a;font:inherit;font-weight:700;cursor:pointer;padding:6px}
.stat{display:flex;gap:12px;margin:18px 0 4px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{font:800 1.8rem var(--hd);display:block}
.view{animation:rise .5s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

function success(first,done){
var o=document.createElement("div");o.className="okov";
o.innerHTML='<div class="okc"><i class="okr"></i><i class="okr r2"></i><svg viewBox="0 0 80 80" width="110" height="110" aria-hidden="true"><circle class="okcirc" cx="40" cy="40" r="36"/><path class="okchk" d="M24 41l12 12 21-24"/></svg></div><h2>You’re registered, '+esc(first)+'!</h2><p>Preparing your lucky ticket…</p>';

var fresh=false;
function ticket(){
var a=load(),t=last(),r=a.filter(function(x){return x.token===t})[0];
if(!r){app.innerHTML='<section class="view">'+brand+'<h2>No ticket yet.</h2><p class="lead">Register first and your lucky draw ticket will show up here.</p><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="#home">Register now</a></section>';return}
var dt=new Date(r.at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
app.innerHTML='<section class="view">'+brand+'<div class="cheer"><h2>You’re in, '+esc(r.name.split(" ")[0])+'!</h2><p class="lead" style="margin:8px auto 0">Keep this ticket handy for the draw.</p></div>'+
'<div class="ticket-wrap"><div class="tk"><div class="tk-top"><i class="notch-r"></i><small>Techlogica lucky draw ticket</small><div class="big" id="tok">'+esc(r.token)+'</div><div class="name">'+esc(r.name)+'</div></div>'+
'<div class="tk-bot"><i class="notch-r"></i><div class="row"><div><small>Interested in</small><b>'+esc(r.prod)+'</b></div><div style="text-align:right"><small>Registered</small><b>'+dt+'</b></div></div><div class="bars"></div></div></div></div>'+
'<div class="acts"><button class="btn ghost" id="cp">Copy ticket ID</button><button class="btn ghost" id="pr">Print ticket</button></div></section>';
$("#cp").onclick=function(){var b=this;try{navigator.clipboard.writeText(r.token).then(function(){b.textContent="Copied"})}catch(e){b.textContent=r.token}};
$("#pr").onclick=function(){window.print()};
if(fresh){fresh=false;scramble($("#tok"),r.token);setTimeout(confetti,700)}}

function scramble(el,final){var n=0,iv=setInterval(function(){n++;var s="";for(var i=0;i<final.length;i++)s+=(i<5||final[i]==="-"||i<n/3)?final[i]:ALPHA[Math.floor(Math.random()*ALPHA.length)];el.textContent=s;if(n>16){clearInterval(iv);el.textContent=final}},60)}

function confetti(){
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
var c=$("#fx"),x=c.getContext("2d"),w=c.width=innerWidth,h=c.height=innerHeight,cols=["#1b75bc","#2f3892","#5bb0ee","#8e9be8","#2a56b0"],p=[];
for(var i=0;i<110;i++)p.push({x:w/2,y:h*.42,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%5]});
var f=0;(function t(){x.clearRect(0,0,w,h);p.forEach(function(q){q.vy+=.38;q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,w,h)})()}

$("#rows").innerHTML=l.length?l.map(function(x){return'<tr><td><b>'+esc(x.token)+'</b></td><td>'+esc(x.name)+'<br><span style="color:var(--mute)">'+esc(x.phone)+(x.org?" · "+esc(x.org):"")+'</span>'+(x.remarks?'<br><i>'+esc(x.remarks)+'</i>':"")+'</td><td>'+esc(x.prod)+'</td><td><button class="del" data-t="'+esc(x.token)+'">Delete</button></td></tr>'}).join(""):'<tr><td colspan="4">No registrations yet. They appear here as visitors sign up.</td></tr>'}
var by=function(p){return a.filter(function(x){return x.prod.indexOf(p)>-1}).length};

'<input id="s" placeholder="Search name, phone or ticket" style="margin-top:14px"><div class="scroll"><table><thead><tr><th>Ticket</th><th>Visitor</th><th>Interest</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>'+

$("#pick").onclick=function(){if(!a.length){$("#win").textContent="No entries to draw from yet.";return}var w=a[Math.floor(Math.random()*a.length)];$("#win").innerHTML='Winner: <b>'+esc(w.token)+'</b> · '+esc(w.name);confetti()}}
